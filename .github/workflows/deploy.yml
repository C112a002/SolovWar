name: Deploy SolovWar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build home menu and game site
        run: |
          mkdir -p _site/game extracted
          unzip -q SolovWar-textures-updated.zip -d extracted
          cp -a extracted/SolovWar/. _site/game/
          cp index.html menu.css menu.js auth-config.js discord-auth.js _site/
          cp manifest.json _site/
          cp -a icons _site/
          cp -a menu-assets _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
