<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SolovWar 槍戰</title>
<style>
:root{--bg:#10131a;--card:rgba(255,255,255,.92);--fg:#1b1d22;--sub:#555b66;--accent:#3d7bff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(24,27,34,.93);--fg:#eceef2;--sub:#a3a9b5;color-scheme:dark}}
:root[data-theme="dark"]{--card:rgba(24,27,34,.93);--fg:#eceef2;--sub:#a3a9b5;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:10px;font:13px/1.2 inherit;font-family:inherit;padding:7px 11px}
#pos{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font-variant-numeric:tabular-nums}
#pos{display:none}body.showpos #pos{display:block}
#gear{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:30;font-size:20px;line-height:1;padding:7px 10px;cursor:pointer}
body.setopen #gear{display:none}
#jump{right:max(26px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;font-size:15px;display:none;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55)}
body.touch.playing #jump{display:block}
#joy{position:fixed;display:none;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);transform:translate(-50%,-50%);pointer-events:none;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.6)}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:24px;box-sizing:border-box}
.card{background:var(--card);color:var(--fg);border-radius:18px;padding:22px 24px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.card h1{margin:0 0 10px;font-size:20px}
.card p{margin:0 0 16px;font-size:14px;line-height:1.7;color:var(--sub)}
.card p.st{margin:-6px 0 14px;font-size:13px;line-height:1.75;color:var(--fg);font-variant-numeric:tabular-nums;white-space:pre-line}
.card p.st:empty{display:none}
#start,#done{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
body.touch .k,body:not(.touch) .t{display:none}
#settings{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px;box-sizing:border-box}
#settings.open{display:flex}
.panel{max-height:100%;overflow-y:auto;box-sizing:border-box;touch-action:pan-y}
.panel h2{margin:16px 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:0 0 10px}
.panel input[type=range]{width:100%;margin:0 0 14px;accent-color:var(--accent);touch-action:none}
.panel input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.kb,.sel{min-width:88px;border:1px solid var(--sub);border-radius:8px;padding:6px 10px;background:transparent;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.kb.wait{border-color:var(--accent);color:var(--accent)}
.sel option{color:#1b1d22}
.sbtn{width:100%;border:0;border-radius:12px;padding:11px;margin-top:8px;font-size:14px;font-family:inherit;cursor:pointer;background:rgba(127,127,127,.2);color:var(--fg)}
#done{margin-top:14px}
/* 準星：四條線會隨移動與連射擴散 */
#xh{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:4;--sp:6px;transition:opacity .15s}
#xh i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#xh .a{width:2px;height:7px;left:-1px;top:calc(-7px - var(--sp))}
#xh .b{width:2px;height:7px;left:-1px;top:var(--sp)}
#xh .c{width:7px;height:2px;top:-1px;left:calc(-7px - var(--sp))}
#xh .d{width:7px;height:2px;top:-1px;left:var(--sp)}
#xh .e{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%;background:#fff}
body.aim #xh .a,body.aim #xh .b,body.aim #xh .c,body.aim #xh .d{opacity:.35}
#hm{position:fixed;left:50%;top:50%;width:28px;margin:-14px;font:700 22px/28px sans-serif;text-align:center;color:#fff;text-shadow:0 0 4px #000;opacity:0;pointer-events:none;z-index:4}
#dmg{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 110px 30px rgba(230,30,30,.85)}
#low{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 140px 20px rgba(160,0,0,.75)}
#scope{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);transition:opacity .15s}
body.aim #scope{opacity:1}
#dir{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:4}
#dir b{position:absolute;left:-38px;top:-150px;width:76px;height:9px;border-radius:5px;background:linear-gradient(90deg,rgba(255,60,60,0),rgba(255,60,60,.95),rgba(255,60,60,0));transform-origin:38px 150px;opacity:0}
#top{top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
#hp{left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;pointer-events:none}
#hpb{width:110px;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
#hpf{display:block;height:100%;width:100%;background:#3ddc6b}
#ammo{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
#stance{font-size:12px;opacity:.8}
#banner{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:30px;font-weight:700;line-height:1.3;font-family:inherit;color:#fff;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6;white-space:pre-line}
#banner small{display:block;font-size:15px;font-weight:500;opacity:.85}
#banner.on{opacity:1}
#kf{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 46px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;max-width:60vw}
.kfi{background:rgba(0,0,0,.5);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;line-height:1.35;white-space:nowrap;animation:kfo 6s forwards}
.kfi .me{color:#ffd84a;font-weight:700}.kfi .hs{color:#ff6a5a}
@keyframes kfo{0%,85%{opacity:1}100%{opacity:0}}
#chat{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 46px);width:min(330px,62vw);display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:12.5px;line-height:1.4;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000}
.chl{animation:cho 9s forwards}.chl b{color:#ff8a7a;font-weight:600}.chl.sys{color:#ffd84a}
@keyframes cho{0%,88%{opacity:1}100%{opacity:0}}
body:not(.showkf) #kf,body:not(.showchat) #chat{display:none}
#fire,#rld,#adsb,#crh{display:none;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.6);background:rgba(220,50,50,.45);font-size:15px}
#fire{right:max(26px,env(safe-area-inset-right));bottom:max(122px,calc(env(safe-area-inset-bottom) + 112px));width:84px;height:84px}
#rld{right:max(118px,calc(env(safe-area-inset-right) + 108px));bottom:max(34px,env(safe-area-inset-bottom));width:56px;height:56px;background:rgba(255,255,255,.22);font-size:13px}
#adsb{right:max(122px,calc(env(safe-area-inset-right) + 112px));bottom:max(134px,calc(env(safe-area-inset-bottom) + 124px));width:56px;height:56px;background:rgba(255,255,255,.22);font-size:13px}
#crh{right:max(184px,calc(env(safe-area-inset-right) + 174px));bottom:max(34px,env(safe-area-inset-bottom));width:56px;height:56px;background:rgba(255,255,255,.22);font-size:13px}
body.touch.playing #fire,body.touch.playing #rld,body.touch.playing #adsb,body.touch.playing #crh{display:block}
#adsb.on,#crh.on{background:rgba(61,123,255,.6)}
</style>
</head>
<body>
<div id="joy"><div id="knob"></div></div>
<div id="pos" class="hud">載入中…</div>
<button id="gear" class="hud btn" title="設定（遊玩中先按 Esc 釋放滑鼠）" aria-label="設定">⚙</button>
<button id="jump" class="hud btn">跳躍</button>
<div id="low"></div><div id="dmg"></div><div id="scope"></div>
<div id="xh"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i></div>
<div id="hm">✕</div><div id="dir"></div><div id="banner"></div>
<div id="top" class="hud">第 1 波　擊殺 0　敵人 0</div>
<div id="kf"></div><div id="chat"></div>
<div id="hp" class="hud"><div id="hpb"><i id="hpf"></i></div><b id="hpn">100</b><span id="ammo">30 / ∞</span><span id="stance"></span></div>
<button id="fire" class="hud btn">開火</button><button id="rld" class="hud btn">換彈</button><button id="adsb" class="hud btn">瞄準</button><button id="crh" class="hud btn">蹲下</button>
<div id="overlay"><div class="card">
<h1 id="ovh">🔫 SolovWar 槍戰</h1><p id="ovm"></p><p class="st" id="stats"></p>
<p class="k" id="help">W A S D 移動　滑鼠轉向<br>空白鍵跳躍　Shift 衝刺<br>R 重新出生　Esc 暫停</p>
<p class="t">左半邊拖曳：移動（拖到最外圈會衝刺）<br>右半邊滑動：轉向<br>按住「開火」可邊射邊轉向<br>右下按鈕：開火／換彈／跳躍／蹲下／瞄準</p>
<button id="start">開始戰鬥</button>
</div></div>
<div id="settings"><div class="card panel">
<h1>⚙ 設定</h1>
<div class="row"><span>視角靈敏度</span><b id="sensV">100%</b></div>
<input type="range" id="sens" min="20" max="300" step="5" value="100">
<div class="row"><span>視野角度</span><b id="fovV">75°</b></div>
<input type="range" id="fov" min="60" max="100" step="1" value="75">
<div class="row"><span>音量</span><b id="volV">70%</b></div>
<input type="range" id="vol" min="0" max="100" step="5" value="70">
<label class="row"><span>敵人強度</span><select id="diff" class="sel"><option value="0">輕鬆</option><option value="1">標準</option><option value="2">老手</option><option value="3">惡夢</option></select></label>
<label class="row"><span>顯示座標</span><input type="checkbox" id="showPos"></label>
<label class="row"><span>擊殺訊息</span><input type="checkbox" id="optKf" checked></label>
<label class="row"><span>隊伍聊天</span><input type="checkbox" id="optChat" checked></label>
<label class="row"><span>受傷血霧</span><input type="checkbox" id="optBlood" checked></label>
<div class="k"><h2>按鍵設定</h2><div id="binds"></div></div>
<button id="respawn" class="sbtn">↺ 重新出生</button>
<button id="reset" class="sbtn">還原預設設定</button>
<button id="done">完成</button>
</div></div>

/* 聽覺：處理待處理的聲音事件，以及近距離腳步聲 */

/* 隊友通報：看到玩家的人喊出位置，其他人收到情報 */

/* ---- 敵人導航：路徑跟隨、掩體、包抄、漫遊 ---- */
function nearestNode(x,y,z,usable){
  let best=-1,bd=1e9;
  for(let i=0;i<NAV.n;i++){
    if(usable&&!NAV.usable[i])continue;
    const dx=NAV.x[i]+.5-x,dy=(NAV.y[i]-y)*2.2,dz=NAV.z[i]+.5-z,d=dx*dx+dy*dy+dz*dz;
    if(d<bd){bd=d;best=i;}

function walkClear(x0,z0,x1,z1,y){
  const dx=x1-x0,dz=z1-z0,n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.3));
  for(let k=1;k<=n;k++){

    if(hit(sx,y+.02,sz,H)||!solid(Math.floor(sx),Math.floor(y)-1,Math.floor(sz)))return false;
  }

}
/* 目標節點的距離場（目標或地圖變動才重算） */
function ensureField(b,goal){
  if(b.fieldGoal!==goal||b.fieldVer!==navVer){distField(goal,b.F);b.fieldGoal=goal;b.fieldVer=navVer;}
}
/* 沿距離場往目標走一步：回傳 0 無路、1 前進中、2 已抵達；會設定 b.px/pz 與 b.pkind */
function pathStep(b,F){
  const n=nodeAt(b.x,b.y,b.z);
  if(n<0||F[n]<0)return 0;
  if(F[n]===0)return 2;
  const out=NAV.out[n];let bj=-1,bk=0,bh=-1;
  for(let k=0;k<out.length;k++){
    const j=out[k][0],t=out[k][1];if(F[j]<0||F[j]+(t?2:1)!==F[n])continue;
    const h=hash3(b.id,j,n);if(h>bh){bh=h;bj=j;bk=t;}      /* 平手時依個人偏好選路，避免排成一列 */
  }
  if(bj<0){let md=F[n];for(const[j,t]of out)if(F[j]>=0&&F[j]<md){md=F[j];bj=j;bk=t;}if(bj<0)return 0;}
  let tx=NAV.x[bj]+.5,tz=NAV.z[bj]+.5;

  if(bk===0){                                                /* 拉直路徑：往前看最多 3 個節點 */
    let c=bj;
    for(let s=0;s<3;s++){
      if(F[c]===0)break;
      let nj=-1,nt=0,nh=-1;
      for(const[j,t]of NAV.out[c]){if(F[j]<0||F[j]+(t?2:1)!==F[c])continue;const h=hash3(b.id,j,c);if(h>nh){nh=h;nj=j;nt=t;}}
      if(nj<0||nt!==0||NAV.y[nj]!==NAV.y[bj])break;
      const nx=NAV.x[nj]+.5,nz=NAV.z[nj]+.5;

  }

/* 朝距離場移動，設定移動意圖 */
function moveField(b,F,speed){
  const st=pathStep(b,F);
  if(st===1){
    const dx=b.px-b.x,dz=b.pz-b.z,l=Math.hypot(dx,dz)||1;
    b.mx=dx/l;b.mz=dz/l;b.sp=speed;

/* 掩體：找一個「蹲下也藏得住」且旁邊有探頭位置的節點 */

  const n0=nodeAt(b.x,b.y,b.z);if(n0<0)return null;

  distFrom(n0,b.CF,12);

  for(let i=0;i<NAV.n;i++){

    const x=NAV.x[i]+.5,y=NAV.y[i],z=NAV.z[i]+.5;
    let taken=false;for(const o of E)if(o!==b&&!o.dead&&o.coverNode===i){taken=true;break;}if(taken)continue;

/* 包抄：找一個能打到玩家、與目前接近方向夾角夠大、又沒被其他人佔用的側翼位置 */

    const x=NAV.x[i]+.5,y=NAV.y[i],z=NAV.z[i]+.5,a=Math.atan2(z-pos.z,x-pos.x),ang=Math.abs(angDiff(a,appr));

/* 漫遊：隨機挑幾個點，偏向離玩家近的（他們知道玩家在這棟建築裡） */

    const i=(Math.random()*NAV.n)|0;if(!NAV.usable[i]||b.CF[i]<7)continue;

/* ---- 敵人大腦：行為模式（漫遊→追查→警戒→搜索→交戰）與戰術 ---- */
const lk=(b,y)=>{b.lookYaw=y;b.lookSet=true;};
function startReload(b){

  b.reloadTot=rnd(2,2.6);b.reloadT=b.reloadTot;b.burstLeft=0;snd('reload',.5,b.x,b.y+1,b.z);
  if(b.mode==='fight'&&Math.random()<.4)say(b,pick(['換彈夾，掩護我','我在換彈！','等一下，我換彈！']));

function enterFight(b){b.mode='fight';b.tac='';b.tacEnd=0;b.sphase='shoot';b.sphaseT=rnd(.3,.8);b.flank=-1;b.cphase='';}
/* 依個性、血量、彈量、壓制、距離與隊友狀況，加權隨機選擇戰術 */

  else if(b.style==='holder'){if(cv)w.cover=2.2;else w.hold=1.4;}
  else if(b.style==='support'){if(cv)w.cover=1.5;w.hold=.4;}
  else{w.flank=(ALLYC>0&&dist>7)?2:0;if(cv)w.cover=.6;}
  if(b.mag<=2&&cv){w.retreat=3;w.rush=0;}
  if(hpf<.35&&bv<.75){if(cv)w.retreat+=3*(1-bv);w.rush=0;}
  if(b.supp>.55&&cv)w.cover+=1.4;

/* 高層決策：每 0.2 秒左右重新評估一次 */
function think(b){

  if(b.inContact){
    if(b.mode!=='fight')enterFight(b);
    if(t>=b.tacEnd||!b.tac)chooseTactic(b);
    return;
  }
  if(b.mode==='fight'){
    const lim=(b.tac==='cover'||b.tac==='retreat')?8:2.4;
    if(t-b.seenT>lim){b.mode='search';b.sstage=0;b.sgoal=-1;b.searchT=t;b.searchN=0;}
    else if(t>=b.tacEnd&&b.tac!=='cover'&&b.tac!=='retreat')chooseTactic(b);
    return;
  }
  if(b.alertT>t&&b.mode!=='search'&&b.mode!=='fight'){b.mode='alert';return;}
  if(b.mode==='alert'){b.mode=b.invest?'invest':(kconf(b)>.12?'hunt':'roam');b.investT=t;b.igoal=-1;return;}

function act(b,dt){

/* ---- 交戰 ---- */

function actFight(b,dt){

/* 停下點射 ↔ 橫移（A/D 互換）：像真人一樣「急停再開槍」 */

function fightRush(b,dt,ux,uz,dist){

function fightHold(b,dt,ux,uz){

  if(b.sphase==='move'){b.mx=-uz*b.strafeDir;b.mz=ux*b.strafeDir;b.sp=1.6;b.wantCrouch=false;b.allowFire=false;if((b.sphaseT-=dt)<=0){b.sphase='shoot';b.strafeDir=-b.strafeDir;}}

/* ---- 敵人戰鬥：瞄準控制、開火、移動與物理、每幀更新 ---- */
const PR={t:1e9,z:0};

function aimFire(b,dt){

      }

/* 物理：與玩家相同的格子碰撞 */
function physBot(b,dt,ph){

function moveBot(b,dt){

const HC2={top:'',hpn:-1,ammo:'',st:''};
function hud(){
  const al=E.reduce((n,e)=>n+!e.dead,0)+queue,top='第 '+wave+' 波　擊殺 '+kills+'　敵人 '+al;
  if(top!==HC2.top){HC2.top=top;$('top').textContent=top;}
  const h=Math.max(0,Math.ceil(hp));
  if(h!==HC2.hpn){HC2.hpn=h;$('hpn').textContent=h;$('hpf').style.width=Math.max(0,hp)+'%';$('hpf').style.background=hp>50?'#3ddc6b':hp>25?'#f0b429':'#ee4b4b';}
  const am=rel>0?'換彈中…':ammo+' / ∞';
  if(am!==HC2.ammo){HC2.ammo=am;$('ammo').textContent=am;$('ammo').style.color=(rel===0&&ammo<=6)?'#ffb04a':'';}
}
function banner(t,sub){
  const b=$('banner');b.textContent=t;
  if(sub){const s=document.createElement('small');s.textContent=sub;b.appendChild(s);}
  b.classList.add('on');clearTimeout(banner.t);banner.t=setTimeout(()=>b.classList.remove('on'),2200);
}
/* 隊伍聊天與系統訊息 */
function chatLine(name,text,sys){
  const box=$('chat'),d=document.createElement('div');d.className='chl'+(sys?' sys':'');
  if(name){const b=document.createElement('b');b.textContent=name;d.appendChild(b);d.appendChild(document.createTextNode('：'+text));}
  else d.textContent=text;
  box.appendChild(d);while(box.childNodes.length>6)box.removeChild(box.firstChild);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},9300);
}
const sysLine=t=>chatLine('',t,true);
function killFeed(killer,victim,head,mine){
  const box=$('kf'),d=document.createElement('div');d.className='kfi';
  const a=document.createElement('span');a.textContent=killer;if(mine||killer==='你')a.className='me';
  d.appendChild(a);d.appendChild(document.createTextNode(' ➤ '+victim+(head?' ':'')));
  if(head){const s=document.createElement('span');s.className='hs';s.textContent='爆頭';d.appendChild(s);}
  box.appendChild(d);while(box.childNodes.length>5)box.removeChild(box.firstChild);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},6100);
}
/* 受擊方向指示（紅色弧條，指向開槍的人） */
const DIRS=[];
function showDir(sx,sz){
  const dx=sx-pos.x,dz=sz-pos.z,fw=dx*-Math.sin(yaw)+dz*-Math.cos(yaw),rt=dx*Math.cos(yaw)+dz*-Math.sin(yaw),a=Math.atan2(rt,fw);
  let o=DIRS.find(q=>q.t<=0);
  if(!o){if(DIRS.length>=6)return;const el=document.createElement('b');$('dir').appendChild(el);o={el,t:0};DIRS.push(o);}
  o.t=1.5;o.el.style.transform='rotate('+a+'rad)';
}
function tickDirs(dt){for(const o of DIRS){if(o.t>0){o.t-=dt;o.el.style.opacity=Math.max(0,Math.min(1,o.t/1.1));}}}
/* 補給包：敵人倒下時有機會掉落，走過去撿起來回血 */
const LOOT=[],lkB=new THREE.BoxGeometry(.34,.2,.24),lkC1=new THREE.BoxGeometry(.2,.215,.07),lkC2=new THREE.BoxGeometry(.07,.215,.2);
const lkMW=new THREE.MeshBasicMaterial({color:0xe9ecef}),lkMR=new THREE.MeshBasicMaterial({color:0xd8362f});
const lkGlow=new THREE.SpriteMaterial({map:glowTexP,color:0x4cff8a,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.55});
function dropLoot(b){
  if(LOOT.length>=3)return;
  const need=hp<50?.3:hp<80?.12:0,p=.1+need+Math.min(.1,wave*.01);
  if(Math.random()>p)return;
  let y=b.y;for(let yy=Math.floor(b.y+.3);yy>=1;yy--)if(solid(Math.floor(b.x),yy-1,Math.floor(b.z))){y=yy;break;}
  const g=new THREE.Group();
  g.add(new THREE.Mesh(lkB,lkMW));g.add(new THREE.Mesh(lkC1,lkMR),new THREE.Mesh(lkC2,lkMR));
  const sp=new THREE.Sprite(lkGlow);sp.scale.set(1.2,1.2,1);g.add(sp);
  g.position.set(b.x,y+.15,b.z);scene.add(g);
  const l=lightAt(b.x,y+.4,b.z),s=Math.min(1.3,.55+(l[0]+l[1]+l[2])/3*.9);
  g.children[0].material=new THREE.MeshBasicMaterial({color:new THREE.Color(.91*s,.93*s,.94*s)});
  LOOT.push({g,x:b.x,y,z:b.z,t:0,ph:Math.random()*6});
}
function lootTick(dt){
  for(let i=LOOT.length-1;i>=0;i--){
    const o=LOOT[i];o.t+=dt;o.g.rotation.y+=dt*1.5;o.g.position.y=o.y+.17+Math.sin(o.t*3+o.ph)*.045;
    let take=false;
    if(hp<100&&Math.hypot(pos.x-o.x,pos.z-o.z)<1&&Math.abs(pos.y-o.y)<1.8){
      const add=Math.min(100-hp,30);hp+=add;take=true;snd('pick',.9);sysLine('拾取急救包　生命 +'+Math.round(add));hud();
    }
    if(take||o.t>50){scene.remove(o.g);if(o.g.children[0].material!==lkMW)o.g.children[0].material.dispose();LOOT.splice(i,1);}
  }
}
function lootClear(){for(const o of LOOT){scene.remove(o.g);}LOOT.length=0;}
/* 結算資訊 */
function showStats(){
  const acc=shots>0?Math.round(hitsN/shots*100):0;
  $('stats').textContent='擊殺 '+stKills+'（爆頭 '+stHeads+'）　命中率 '+acc+'%\n承受傷害 '+Math.round(stDmg)+'　最佳紀錄：第 '+cfg.best+' 波';
}
/* ---- 輸入：鍵盤、滑鼠（含無法鎖定滑鼠時的拖曳轉向）、觸控、設定面板 ---- */
let lockFail=false,joyId=null,joyO=null,lookId=null,lx=0,ly=0,setOpen=false,wasActive=false,capture=null;
function setActive(on){
  active=on;document.body.classList.toggle('playing',on);$('overlay').style.display=on?'none':'flex';
  if(!on){firing=false;adsMouse=false;}
}
function lockNote(){if(active&&!dead)banner('無法鎖定滑鼠','按住滑鼠左鍵或右鍵並移動來轉向（Esc 暫停）');}
function lockPointer(){
  if(isTouch)return;
  lockFail=false;const c=renderer.domElement;
  if(!c.requestPointerLock){lockFail=true;lockNote();return;}
  try{const p=c.requestPointerLock();if(p&&p.catch)p.catch(()=>{lockFail=true;lockNote();});}catch(e){lockFail=true;lockNote();}
}
function pauseGame(){if(active&&!dead){setActive(false);$('start').textContent='繼續戰鬥';}}
$('start').addEventListener('click',()=>{
  if(dead)newGame();
  ac();setActive(true);last=performance.now();lockPointer();
});
document.addEventListener('pointerlockerror',()=>{lockFail=true;lockNote();});
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement===renderer.domElement){lockFail=false;return;}
  if(!isTouch&&!lockFail)pauseGame();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
const lookBy=(dx,dy,k)=>{const s=k*cfg.sens*lerp(1,.62,adsT);yaw-=dx*s;pitch-=dy*s;clampPitch();};
document.addEventListener('mousemove',e=>{
  if(!active||dead)return;
  if(document.pointerLockElement===renderer.domElement)lookBy(e.movementX,e.movementY,.0022);
  else if(lockFail&&e.buttons)lookBy(e.movementX||0,e.movementY||0,.0026);
});
addEventListener('mousedown',e=>{
  if(isTouch||!active||dead)return;
  if(e.button===0)firing=true;else if(e.button===2)adsMouse=true;
});
addEventListener('mouseup',e=>{if(e.button===0)firing=false;else if(e.button===2)adsMouse=false;});
addEventListener('contextmenu',e=>{if(active)e.preventDefault();});
addEventListener('keydown',e=>{
  if(capture){
    e.preventDefault();
    if(e.code!=='Escape'){
      const c=norm(e.code),o=Object.keys(cfg.bind).find(k=>k!==capture&&cfg.bind[k]===c);
      if(o)cfg.bind[o]=cfg.bind[capture];
      cfg.bind[capture]=c;save();renderHelp();
    }
    capture=null;renderBinds();if(document.activeElement)document.activeElement.blur();return;
  }
  if(e.code==='Escape'){
    if(setOpen){closeSet();return;}
    if(active&&(lockFail||isTouch)){pauseGame();return;}
  }
  const c=norm(e.code);keys[c]=true;
  if(active&&(c==='Space'||c.startsWith('Arrow')||Object.values(cfg.bind).includes(c)))e.preventDefault();
  if(active&&!dead&&!e.repeat){
    if(c===cfg.bind.respawn)respawn();
    if(c===cfg.bind.reload)reload();
  }
});
addEventListener('keyup',e=>{keys[norm(e.code)]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;firing=false;adsMouse=false;});
/* 觸控：左半邊虛擬搖桿、右半邊轉向、按鈕開火／換彈／跳躍／蹲下／瞄準 */
function resetJoy(){joyId=null;mv.x=mv.y=0;mv.run=false;$('joy').style.display='none';$('knob').style.transform='';}
addEventListener('touchstart',e=>{
  if(!active)return;
  let handled=false;
  for(const t of e.changedTouches){
    if(t.target.closest&&t.target.closest('.btn'))continue;
    if(t.clientX<innerWidth/2&&joyId===null){
      joyId=t.identifier;joyO=[t.clientX,t.clientY];handled=true;
      const j=$('joy');j.style.display='block';j.style.left=t.clientX+'px';j.style.top=t.clientY+'px';
    }else if(t.clientX>=innerWidth/2&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;handled=true;}
  }
  if(handled)e.preventDefault();
},{passive:false});
addEventListener('touchmove',e=>{
  if(e.target.closest&&e.target.closest('#settings'))return;
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      let dx=t.clientX-joyO[0],dy=t.clientY-joyO[1];const r=50,d=Math.hypot(dx,dy);
      mv.run=d>r*1.1;if(d>r){dx*=r/d;dy*=r/d;}
      mv.x=dx/r;mv.y=-dy/r;$('knob').style.transform='translate('+dx+'px,'+dy+'px)';
    }else if(t.identifier===lookId){
      yaw-=(t.clientX-lx)*.0055*cfg.sens*lerp(1,.62,adsT);pitch-=(t.clientY-ly)*.0055*cfg.sens*lerp(1,.62,adsT);clampPitch();lx=t.clientX;ly=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});
const endTouch=e=>{
  for(const t of e.changedTouches){
    if(t.identifier===fireId){firing=false;fireId=null;}
    if(t.identifier===joyId)resetJoy();
    if(t.identifier===lookId)lookId=null;
  }
};
addEventListener('touchend',endTouch);addEventListener('touchcancel',endTouch);
const jb=$('jump');
jb.addEventListener('touchstart',e=>{jumpHeld=true;e.preventDefault();},{passive:false});
jb.addEventListener('touchend',()=>{jumpHeld=false;});
jb.addEventListener('touchcancel',()=>{jumpHeld=false;});
$('fire').addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];firing=true;fireId=t.identifier;
  if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}
  e.preventDefault();
},{passive:false});
$('rld').addEventListener('touchstart',e=>{reload();e.preventDefault();},{passive:false});
$('adsb').addEventListener('touchstart',e=>{adsBtn=!adsBtn;$('adsb').classList.toggle('on',adsBtn);e.preventDefault();},{passive:false});
$('crh').addEventListener('touchstart',e=>{crouchBtn=!crouchBtn;$('crh').classList.toggle('on',crouchBtn);e.preventDefault();},{passive:false});
/* ---- 設定面板 ---- */
const sens=$('sens'),sensV=$('sensV'),fovS=$('fov'),fovV=$('fovV'),volS=$('vol'),volV=$('volV'),diffS=$('diff');
const showPos=$('showPos'),optKf=$('optKf'),optChat=$('optChat'),optBlood=$('optBlood');
function renderHelp(){
  const n=a=>kname(cfg.bind[a]);
  $('help').innerHTML=[n('fwd'),n('left'),n('back'),n('right')].join(' ')+' 移動　滑鼠轉向<br>左鍵 開火　右鍵／'+n('aim')+' 瞄準<br>'+n('jump')+' 跳躍　'+n('run')+' 衝刺　'+n('crouch')+' 蹲下<br>'+n('reload')+' 換彈　'+n('respawn')+' 重新出生　Esc 暫停';
}
function renderBinds(){
  const box=$('binds');box.innerHTML='';
  for(const[a,name]of ACTIONS){
    const r=document.createElement('div'),b=document.createElement('button'),l=document.createElement('span');
    r.className='row';l.textContent=name;
    b.className='kb'+(capture===a?' wait':'');b.textContent=capture===a?'按下按鍵…':kname(cfg.bind[a]);
    b.addEventListener('click',()=>{capture=capture===a?null:a;renderBinds();});
    r.append(l,b);box.append(r);
  }
}
function syncUI(){
  sens.value=Math.round(cfg.sens*100);sensV.textContent=sens.value+'%';
  fovS.value=cfg.fov;fovV.textContent=cfg.fov+'°';
  volS.value=Math.round(cfg.vol*100);volV.textContent=volS.value+'%';
  diffS.value=String(cfg.diff);
  showPos.checked=cfg.showPos;optKf.checked=cfg.kf;optChat.checked=cfg.chat;optBlood.checked=cfg.blood;
  const cl=document.body.classList;cl.toggle('showpos',cfg.showPos);cl.toggle('showkf',cfg.kf);cl.toggle('showchat',cfg.chat);
  renderBinds();renderHelp();resizeFov();setVol();
}
function openSet(){
  if(setOpen)return;
  setOpen=true;wasActive=active&&!dead;
  if(document.pointerLockElement)document.exitPointerLock();
  if(active&&!dead){setActive(false);$('start').textContent='繼續戰鬥';}
  resetJoy();lookId=null;jumpHeld=false;
  $('settings').classList.add('open');document.body.classList.add('setopen');
}
function closeSet(){
  if(!setOpen)return;
  capture=null;renderBinds();setOpen=false;
  $('settings').classList.remove('open');document.body.classList.remove('setopen');
  if(wasActive&&isTouch){setActive(true);last=performance.now();}
}
sens.addEventListener('input',()=>{cfg.sens=sens.value/100;sensV.textContent=sens.value+'%';save();});
fovS.addEventListener('input',()=>{cfg.fov=+fovS.value;fovV.textContent=cfg.fov+'°';resizeFov();save();});
volS.addEventListener('input',()=>{cfg.vol=volS.value/100;volV.textContent=volS.value+'%';setVol();save();});
diffS.addEventListener('change',()=>{cfg.diff=+diffS.value|0;save();});
showPos.addEventListener('change',()=>{cfg.showPos=showPos.checked;document.body.classList.toggle('showpos',cfg.showPos);save();});
optKf.addEventListener('change',()=>{cfg.kf=optKf.checked;document.body.classList.toggle('showkf',cfg.kf);save();});
optChat.addEventListener('change',()=>{cfg.chat=optChat.checked;document.body.classList.toggle('showchat',cfg.chat);save();});
optBlood.addEventListener('change',()=>{cfg.blood=optBlood.checked;save();});
$('reset').addEventListener('click',()=>{
  Object.assign(cfg,{sens:1,fov:75,vol:.7,diff:1,showPos:false,kf:true,chat:true,blood:true,bind:{...DEF_BIND}});
  capture=null;save();syncUI();
});
$('respawn').addEventListener('click',()=>{respawn();closeSet();});
$('gear').addEventListener('click',openSet);
$('done').addEventListener('click',closeSet);
/* ---- 遊戲流程：受傷、死亡、波次、每幀更新與主迴圈 ---- */
const MSG='敵人會聽聲音、找掩護、包抄、換彈，也會互相通報你的位置。爆頭傷害加倍；每波結束回血並補滿彈藥，倒下的敵人有機會掉落急救包。';
$('ovm').textContent=MSG;
let pdVer=-1,deadShown=false;
function hurt(n,sx,sz,head,b){
  if(dead||n<=0)return;
  hp-=n;stDmg+=n;dmgA=Math.min(1,dmgA+n/18+.15);shakeA=Math.min(1,shakeA+n/14);
  recY+=(Math.random()-.5)*.03;recP+=.012;                       /* 被擊中時視角會被打偏 */
  showDir(sx,sz);snd('hurt',head?.9:.6);hud();
  if(hp<=0)die(b,head);
}
function die(b,head){
  if(dead)return;
  dead=true;deathT=0;firing=false;adsMouse=false;killerName=b?b.name:'';
  if(wave>cfg.best){cfg.best=wave;save();}
  $('ovh').textContent='💀 你被擊倒了';
  $('ovm').textContent=(b?'被 '+b.name+(head?'（爆頭）':'')+' 擊倒。':'')+'撐到第 '+wave+' 波，擊殺 '+kills+' 名敵人。';
  $('start').textContent='再戰一次';showStats();
  killFeed(b?b.name:'敵人','你',head,false);snd('thud',1);
  if(b&&Math.random()<.6)say(b,pick(['搞定一個','不錯嘛，可惜了','收工！','GG']),true);
}
function nextWave(){
  wave++;queue=3+wave*2;spawnT=1.2;breakT=-1;
  if(wave>1)hp=Math.min(100,hp+40);
  ammo=MAG;rel=0;if(wave>cfg.best){cfg.best=wave;save();}
  banner('第 '+wave+' 波',queue+' 名敵人'+(wave>1?'　生命回復':''));
  sysLine('第 '+wave+' 波開始，共 '+queue+' 名敵人');
  hud();
}
function newGame(){
  for(const e of E){scene.remove(e.g);for(const m of e.m.mats)m.dispose();}E.length=0;
  fxClear();lootClear();
  wave=0;kills=0;hp=100;ammo=MAG;rel=0;cd=0;dmgA=0;suppA=0;shakeA=0;dead=false;deadShown=false;deathT=0;queue=0;breakT=-1;killerName='';
  stKills=stHeads=stDmg=0;shots=hitsN=headsN=0;
  adsBtn=false;crouchBtn=false;adsT=0;crouchT=0;$('adsb').classList.remove('on');$('crh').classList.remove('on');
  pdNode=-1;pdVer=-1;respawn();recPlayer();
  $('ovh').textContent='🔫 SolovWar 槍戰';$('ovm').textContent=MSG;$('stats').textContent='';
  nextWave();
}
/* 每幀邏輯（玩家死亡或暫停時不會呼叫） */
function tick(dt){
  fxTick(dt);gunTick(dt);recPlayer();
  /* 玩家的距離場：敵人聽聲音、追蹤、衝鋒都靠它 */
  const pn=nodeAt(pos.x,pos.y,pos.z);
  if(pn>=0&&(pn!==pdNode||pdVer!==navVer)){pdNode=pn;pdVer=navVer;distField(pn,PD);}
  let al=0;for(const e of E)if(!e.dead)al++;
  ALLYC=al>1?al-1:0;
  if(queue>0){
    if(al<Math.min(3+wave,8)&&(spawnT-=dt)<=0){if(spawnBot()){queue--;spawnT=rnd(1.3,2.6);hud();}else spawnT=1;}
  }else if(al===0){
    if(breakT<0){breakT=3.5;banner('✔ 第 '+wave+' 波完成');sysLine('第 '+wave+' 波完成');}
    else if((breakT-=dt)<0)nextWave();
  }
  for(let i=E.length-1;i>=0;i--)if(!botTick(E[i],dt))E.splice(i,1);
  lootTick(dt);tickDirs(dt);
  /* 畫面效果：受傷血紅、低血量脈動、命中標記、準心擴散 */
  dmgA=Math.max(0,dmgA-dt*1.6);suppA=Math.max(0,suppA-dt*.7);shakeA=Math.max(0,shakeA-dt*2.4);
  $('dmg').style.opacity=dmgA;hmA=Math.max(0,hmA-dt*5);$('hm').style.opacity=hmA;
  const lowK=clamp((38-hp)/38,0,1);lowT+=dt*(3+lowK*3);
  $('low').style.opacity=Math.min(1,lowK*(.55+.3*Math.sin(lowT))+suppA*.35);
  if(hp<30&&hp>0&&(heartT-=dt)<=0){heartT=.55+hp*.014;snd('heart',.8);}
  const sp=spreadNow(),px=3+sp/Math.tan(fovNow*Math.PI/360)*innerHeight*.5;
  $('xh').style.setProperty('--sp',px.toFixed(1)+'px');
  document.body.classList.toggle('aim',adsT>.5);
  const st=(crouchT>.5?'蹲下':sprinting?'衝刺':'')+(adsT>.5?(crouchT>.5||sprinting?' ':'')+'瞄準':'');
  if(st!==HC2.st){HC2.st=st;$('stance').textContent=st;}
}
function placeCamera(dt){
  const hs=Math.hypot(vel.x,vel.z),ba=onGround?clamp(hs/6,0,1)*lerp(1,.3,adsT)*lerp(1,.6,crouchT):0,b1=Math.sin(bobP*.95);
  landKick=Math.max(0,landKick-dt*.9);
  let ey=pos.y+eyeH()+Math.abs(b1)*.03*ba-landKick*.7,roll=b1*.0045*ba-strafeV*.012*(1-adsT*.6),px=pitch+recP,py=yaw+recY;
  const sh=shakeA*shakeA*.035;
  if(sh>0){px+=(Math.random()-.5)*sh;py+=(Math.random()-.5)*sh;roll+=(Math.random()-.5)*sh*.8;}
  if(dead){const e=1-Math.pow(1-Math.min(1,deathT/.7),3);ey-=(eyeH()-.28)*e;roll+=.9*e;px=lerp(px,-.25,e);}
  camera.position.set(pos.x,ey,pos.z);camera.rotation.set(px,py,roll);
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(active&&!dead){update(dt/2);update(dt/2);tick(dt);}
  else if(dead&&active){                                  /* 倒下動畫，之後才顯示結算畫面 */
    deathT+=dt;fxTick(dt);
    if(deathT>1.5&&!deadShown){deadShown=true;setActive(false);if(document.pointerLockElement)document.exitPointerLock();}
  }
  resizeFov();placeCamera(dt);animateLamps(t/1000);
  renderer.render(scene,camera);
  if(cfg.showPos&&++frames%6===0)$('pos').textContent='X '+pos.x.toFixed(1)+'　Y '+pos.y.toFixed(1)+'　Z '+pos.z.toFixed(1);
}
syncUI();hud();
requestAnimationFrame(frame);
})();
</script>
