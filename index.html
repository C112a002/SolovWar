<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b111d">
  <meta name="description" content="SolovWar — 戰術射擊遊戲主選單">
  <title>SolovWar｜主選單</title>
  <link rel="preload" as="image" href="./menu-assets/background.gif">
  <link rel="stylesheet" href="./menu.css">
</head>
<body>
  <main class="home-screen">
    <div class="menu-stage" aria-label="SolovWar 主選單">
      <nav class="menu-items" aria-label="主選單">
        <a class="menu-item start-item" href="./game/" aria-label="開始遊戲">
          <img src="./menu-assets/start.png" alt="" draggable="false">
        </a>
        <a class="menu-item settings-item" href="./game/?openSettings=1" aria-label="設定">
          <img src="./menu-assets/settings.png" alt="" draggable="false">
        </a>
        <button class="menu-item about-item" type="button" aria-label="關於遊戲" aria-haspopup="dialog" aria-controls="about-dialog">
          <img src="./menu-assets/about.png" alt="" draggable="false">
        </button>
        <button class="menu-item exit-item" type="button" aria-label="離開遊戲">
          <img src="./menu-assets/exit.png" alt="" draggable="false">
        </button>
      </nav>
    </div>

    <div class="dialog-backdrop" id="about-dialog" hidden>
      <section class="about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <h1 id="about-title">關於遊戲</h1>
        <p>SolovWar 戰術射擊體驗</p>
        <p>進入戰場後，可在遊戲內設定調整視角、畫質、音量與操作偏好。</p>
        <button class="dialog-close" type="button">返回主選單</button>
      </section>
    </div>

    <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="./menu.js" defer></script>
</body>
</html>
