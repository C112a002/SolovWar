name = "solovwar-discord-auth"
main = "src/index.js"
compatibility_date = "2026-11-23"
keep_vars = true

[vars]
GAME_ORIGIN = "https://c112a002.github.io"
GAME_PATH_PREFIX = "/SolovWar"
OWNER_DISCORD_ID = "1096316400529842206"

[[d1_databases]]
binding = "ADMIN_DB"
database_name = "solovwar-admin-access"
database_id = "336265a0-b292-4cc2-948e-d8a77bc05383"
migrations_dir = "migrations"

[[ratelimits]]
name = "GAME_SESSION_LIMITER"
namespace_id = "1134882071"
simple = { limit = 20, period = 60 }

# Set secrets with:
# wrangler secret put DISCORD_CLIENT_ID
# wrangler secret put DISCORD_CLIENT_SECRET
# wrangler secret put SESSION_SECRET
